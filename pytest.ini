[pytest]
testpaths = tests
# retk is the package in src/ (what `pip install` ships); tools/ holds only the repo's own scripts
# (check_identifiers.py - stdlib only, run by the pre-commit hook and CI), which the tests import by name.
# The tests run against the source tree, not against an installed copy: the CI "package" job installs
# a built wheel into a clean environment and runs the real `retk` command on it.
pythonpath = src tools
